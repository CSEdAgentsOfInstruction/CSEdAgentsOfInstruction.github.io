type: python
title: Collect scores until stop
prompt: |
  Write a program that reads an unknown number of whole-number scores, one per input line. The word `stop` ends data entry and is not a score.

  Start with an empty list called `scores`. Use `while True` and `break` to collect the scores. Keep each input as text long enough to normalize it with `.strip().lower()` and check for `stop`; convert only actual scores with `int(...)` and append them to `scores`.

  After the loop, print only the list. Use `input()` without a visible prompt. You may assume every input other than the stopping command is a valid whole number.

  For these inputs:

  ```text
  10
  25
  -3
  stop
  ```

  the output must be:

  ```text
  [10, 25, -3]
  ```

  If the first input is `stop`, print `[]`.
part: 2
