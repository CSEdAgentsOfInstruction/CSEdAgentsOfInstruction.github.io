type: python
title: Inspect a word
prompt: |
  Write a program that reads one nonempty word without a visible prompt. The word has no surrounding whitespace.

  Print its first character, last character, and length. Preserve the original letter case. For input `python`, print:

  ```text
  First: p
  Last: n
  Length: 6
  ```

  Use indexes and `len(...)` to find the results. A one-character word has the same first and last character. Test one-character words as well as longer words.
part: 2
points: 10
