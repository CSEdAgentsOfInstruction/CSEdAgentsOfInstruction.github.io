<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352" role="img" aria-labelledby="diagram-title" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="diagram-title">The agent only sees what you copy into the container</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8c959f"/>
    </marker>
  </defs>

  <!-- White card so the picture stays readable on light and dark site themes -->
  <rect width="760" height="352" rx="12" fill="#ffffff"/>

  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f2328">The agent only sees what you copy into the container</text>

  <!-- Your computer -->
  <rect x="24" y="60" width="192" height="268" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="120" y="82" text-anchor="middle" font-weight="600" fill="#1f2328">Your computer</text>

  <rect x="40" y="96" width="160" height="56" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="120" y="120" text-anchor="middle" font-weight="600" fill="#1f2328">VS Code window</text>
  <text x="120" y="136" text-anchor="middle" font-size="11.5" fill="#57606a">what you see and use</text>

  <rect x="40" y="240" width="160" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="120" y="264" text-anchor="middle" font-weight="600" fill="#1f2328">Your files</text>
  <text x="120" y="280" text-anchor="middle" font-size="11.5" fill="#57606a">documents, SSH keys,</text>
  <text x="120" y="296" text-anchor="middle" font-size="11.5" fill="#57606a">other projects</text>

  <!-- The container -->
  <rect x="288" y="60" width="240" height="268" rx="8" fill="#0969da" fill-opacity="0.08" stroke="#0969da" stroke-width="2"/>
  <text x="408" y="82" text-anchor="middle" font-weight="600" fill="#1f2328">Docker container: agent-box</text>

  <rect x="304" y="96" width="208" height="56" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="408" y="120" text-anchor="middle" font-weight="600" fill="#1f2328">VS Code server</text>
  <text x="408" y="136" text-anchor="middle" font-size="11.5" fill="#57606a">terminal and extensions</text>

  <rect x="304" y="168" width="208" height="56" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="408" y="192" text-anchor="middle" font-weight="600" fill="#1f2328">AI agent</text>
  <text x="408" y="208" text-anchor="middle" font-size="11.5" fill="#57606a">edits files, runs commands</text>

  <rect x="304" y="240" width="208" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="408" y="264" text-anchor="middle" font-weight="600" fill="#1f2328">/workspace</text>
  <text x="408" y="280" text-anchor="middle" font-size="11.5" fill="#57606a">your work, kept in the</text>
  <text x="408" y="296" text-anchor="middle" font-size="11.5" fill="#57606a">agent-work volume</text>

  <!-- AI service -->
  <rect x="576" y="160" width="160" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="656" y="184" text-anchor="middle" font-weight="600" fill="#1f2328">AI service</text>
  <text x="656" y="200" text-anchor="middle" font-size="11.5" fill="#57606a">gets your prompts</text>
  <text x="656" y="216" text-anchor="middle" font-size="11.5" fill="#57606a">and file contents</text>

  <!-- Links -->
  <g fill="none" stroke="#8c959f" stroke-width="1.25">
    <path d="M200 124H304" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M200 260H304" marker-end="url(#arrow)"/>
    <path d="M304 292H200" marker-end="url(#arrow)"/>
    <path d="M512 196H576" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <text x="252" y="144" text-anchor="middle" font-size="11.5" fill="#57606a">VS Code</text>
  <text x="252" y="158" text-anchor="middle" font-size="11.5" fill="#57606a">connection</text>
  <text x="252" y="254" text-anchor="middle" font-size="11.5" fill="#57606a">drag in</text>
  <text x="252" y="308" text-anchor="middle" font-size="11.5" fill="#57606a">Download</text>
</svg>
